<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog | Difesa Consumatore Pisa</title>
  <meta name="description" content="Il blog di Difesa Consumatore è ora su Substack: guide su cessione del quinto, sovraindebitamento, CRIF, saldo e stralcio e rimborso voli." />
  <link rel="canonical" href="https://difesaconsumatore.substack.com" />
  <link rel="icon" type="image/png" href="logo.png" />

  <!-- Redirect immediato verso Substack -->
  <meta http-equiv="refresh" content="0; url=https://difesaconsumatore.substack.com" />
  <script>window.location.replace('https://difesaconsumatore.substack.com');</script>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Open Sans', Helvetica, Arial, sans-serif;
      background: #f5f7fb;
      color: #1a3a6b;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 460px;
      background: #fff;
      border: 1px solid #dce4f0;
      border-radius: 14px;
      padding: 40px 32px;
      box-shadow: 0 8px 28px rgba(26,58,107,0.08);
    }
    .logo { width: 64px; height: 64px; margin: 0 auto 18px; }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a3a6b;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #2a5298;
      line-height: 1.7;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #f5c842;
      color: #1a3a6b;
      font-size: 14px;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 999px;
      text-decoration: none;
      transition: background 0.2s, transform 0.15s;
    }
    .btn:hover { background: #f9d96a; transform: translateY(-1px); }
    .small {
      margin-top: 18px;
      font-size: 13px;
      color: #4a6fa5;
    }
    .small a { color: #1a3a6b; font-weight: 600; text-decoration: none; }
    .spinner {
      width: 24px; height: 24px;
      border: 2.5px solid #dce4f0;
      border-top-color: #f5c842;
      border-radius: 50%;
      margin: 0 auto 18px;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo.png" alt="Difesa Consumatore" class="logo" />
    <div class="spinner"></div>
    <h1>Stiamo aprendo il blog…</h1>
    <p>Le nostre guide e articoli sono pubblicati su Substack. Ti stiamo reindirizzando.</p>
    <a href="https://difesaconsumatore.substack.com" class="btn">Vai al blog &rarr;</a>
    <div class="small">
      Se il reindirizzamento non parte automaticamente,<br>
      <a href="https://difesaconsumatore.substack.com">clicca qui</a> oppure
      <a href="index.html">torna alla home</a>.
    </div>
  </div>
</body>
</html>
