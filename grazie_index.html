<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Richiesta inviata | Difesa Consumatore Pisa</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="../logo.png" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--off-white); }
    .grazie-card {
      max-width:480px; background:#fff; border-radius:14px;
      padding:48px 40px; text-align:center;
      box-shadow:0 8px 32px rgba(26,58,107,0.1);
      border-top:4px solid var(--gold);
    }
    .grazie-icon { font-size:3rem; margin-bottom:16px; }
    .grazie-card h1 { font-family:'Playfair Display',serif; color:var(--navy); font-size:1.8rem; margin-bottom:12px; }
    .grazie-card p { color:var(--text-body); line-height:1.7; margin-bottom:24px; }
    .btn-home { display:inline-block; background:var(--gold); color:var(--navy); font-weight:700; padding:13px 28px; border-radius:999px; text-decoration:none; }
  </style>
</head>
<body>
  <div class="grazie-card">
    <div class="grazie-icon">✅</div>
    <h1>Richiesta inviata!</h1>
    <p>Grazie per averci contattato. Il nostro staff analizzerà la tua richiesta e ti risponderà entro <strong>24 ore lavorative</strong>.</p>
    <a href="/" class="btn-home">Torna alla home →</a>
  </div>
  <script src="../nav.js"></script>
</body>
</html>
