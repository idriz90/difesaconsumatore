<script>
document.addEventListener('DOMContentLoaded', function() {
  var sp = document.getElementById('initialSpinner');
  if (sp) sp.remove();
  var btnAdd = document.getElementById('btnAddPratica');
  if (btnAdd) btnAdd.addEventListener('click', function() {
    var main = document.getElementById('btnMainAction');
    if (main) main.click();
  });
  var ps = document.getElementById('praticheSearch');
  if (ps) ps.addEventListener('input', function() {
    var gs = document.getElementById('globalSearch');
    if (gs) { gs.value = ps.value; gs.dispatchEvent(new Event('input')); }
  });
  document.addEventListener('click', function(e) {
    if (e.target && e.target.classList.contains('overlay') && e.target.classList.contains('open')) {
      e.target.classList.remove('open');
    }
  });
  var _raw = localStorage.getItem('dccrm_auth_v5') || sessionStorage.getItem('dccrm_auth_v5');
  if (_raw) {
    try {
      var _sess = JSON.parse(_raw);
      if (_sess && _sess.email) {
        initFirebase(function() {
          startUserSession({
            email: _sess.email,
            nome:  _sess.nome  || _sess.email,
            ruolo: _sess.ruolo || 'Utente',
            authProvider: _sess.authProvider || 'password'
          }, !!localStorage.getItem('dccrm_auth_v5'));
        });
      }
    } catch(e) {}
  }
});
</script>
